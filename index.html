    #formulario button {

      background: #0056b3;
      color: #fff;

      border-radius: 8px;

    const ROOM = APP_ID + "/salaCustomerTouchCR";

    function generarJWT(nombre, email, userId, esModerador) {
      const ahora = Math.floor(Date.now() / 1000);
      const header = { alg: "RS256", typ: "JWT", kid: KEY_ID };
      const payload = {
        aud: "jitsi", iss: "chat",
        iat: ahora, exp: ahora + 28800, nbf: ahora - 5,
        sub: APP_ID, room: "*",
        context: {
          user: {
            moderator: esModerador,
            name: nombre,
            id: userId,
            email: email,
            avatar: "",
            "hidden-from-recorder": false
          },
          features: {
            recording: false, livestreaming: false,
            "outbound-call": false, transcription: false,
            "file-upload": false, flip: false
          }
        }
      };
      return KJUR.jws.JWS.sign("RS256", header, payload, PRIV_KEY);
    }

    function entrarSala() {
      const nombre = document.getElementById("inputNombre").value.trim();
      const email = document.getElementById("inputEmail").value.trim();
      if (!nombre) { alert("Por favor ingresa tu nombre."); return; }

      const userId = nombre.toLowerCase().replace(/\s+/g, '-') + "-autocom";
      const jwt = generarJWT(nombre, email || "sin-email@sala.com", userId, false);

      document.getElementById("formulario").style.display = "none";
      document.getElementById("jaas-container").style.display = "block";

      // ← Solo UNA instancia
      const api = new JitsiMeetExternalAPI("8x8.vc", {
        roomName: ROOM,
        parentNode: document.querySelector('#jaas-container'),
        jwt: jwt,
        width: "100%",
        height: "100%"
      });

      api.addEventListener('readyToClose', function () {
        api.dispose();
        document.getElementById('jaas-container').innerHTML = '';
        document.getElementById('inputNombre').value = '';
        document.getElementById('inputEmail').value = '';
        document.getElementById('formulario').style.display = 'flex';
        document.getElementById('jaas-container').style.display = 'none';
      });
      // ─── PARTICIPANTE ENTRA ───
      api.addEventListener('participantJoined', function (e) {
        const horaEntrada = new Date().toLocaleTimeString('es-MX', {
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
        window.parent.postMessage({
          tipo: 'participanteEntro',
          nombre: e.displayName || 'Participante',
          hora: horaEntrada,
          timestamp: Date.now()
        }, '*');
      });

      // ─── PARTICIPANTE SALE ───
      api.addEventListener('participantLeft', function (e) {
        const horaSalida = new Date().toLocaleTimeString('es-MX', {
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
        window.parent.postMessage({
          tipo: 'participanteSalio',
          nombre: e.displayName || 'Participante',
          hora: horaSalida,
          timestamp: Date.now()
        }, '*');
      });
    }
